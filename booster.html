<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulateur de booster</title>
<style>
:root{
  --bg:#17143a; --panel:#221e52; --line:#3a3580; --text:#f1efff; --muted:#a9a5d6; --gold:#ffcb3d;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#2f2a72,var(--bg) 60%);color:var(--text);
  font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.5}
main{max-width:1000px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:1.7rem;margin:0 0 16px;letter-spacing:.01em}
details{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:28px}
summary{cursor:pointer;font-weight:700}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:12px}
label{display:block;font-size:.9rem;color:var(--muted)}
input[type=file],input[type=text]{display:block;width:100%;margin-top:4px;color:var(--text);background:#17143a;
  border:1px solid var(--line);border-radius:8px;padding:6px}
#status{margin:12px 0 0;font-size:.9rem;color:var(--muted)}
#status.warn{color:#ffb86b}
#slotsInfo{margin:6px 0 0;padding-left:18px;font-size:.85rem;color:var(--muted)}
.stage{display:flex;flex-direction:column;align-items:center;gap:24px}
.pack{width:150px;height:230px;border:0;border-radius:10px;cursor:pointer;position:relative;overflow:hidden;
  background:linear-gradient(160deg,#ffcb3d,#ff7a3d 55%,#c2306b);color:#2a1300;font:inherit;font-weight:800;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  box-shadow:0 12px 30px #0009;transition:transform .2s}
.pack:hover:not(:disabled){transform:translateY(-4px) rotate(-1.5deg)}
.pack:disabled{filter:grayscale(1);opacity:.45;cursor:not-allowed}
.pack::before,.pack::after{content:"";position:absolute;left:0;right:0;height:16px;
  background:repeating-linear-gradient(90deg,#0003 0 6px,transparent 6px 12px)}
.pack::before{top:0}.pack::after{bottom:0}
.pack .big{font-size:3.6rem;line-height:1}
.pack.open{animation:shake .65s}
@keyframes shake{0%,100%{transform:rotate(0)}15%{transform:rotate(-6deg) scale(1.04)}30%{transform:rotate(6deg) scale(1.06)}
  45%{transform:rotate(-5deg) scale(1.08)}60%{transform:rotate(4deg) scale(1.1)}85%{transform:scale(1.12);opacity:.4}}
.actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{font:inherit;font-weight:700;color:var(--text);background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:8px 18px;cursor:pointer}
.btn:hover{border-color:var(--gold)}
#cards{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;min-height:20px}
.card{width:clamp(120px,17vw,170px);aspect-ratio:63/88;perspective:900px;padding:0;border:0;background:none;
  cursor:pointer;animation:deal .5s both}
@keyframes deal{from{opacity:0;transform:translateY(-40px) scale(.9)}to{opacity:1;transform:none}}
.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:10px;overflow:hidden;backface-visibility:hidden}
.back{background:repeating-linear-gradient(45deg,#2e45b8 0 8px,#243898 8px 16px);border:3px solid var(--gold)}
.front{transform:rotateY(180deg);background:#0d0b24;border:2px solid var(--c)}
.front img{width:100%;height:100%;object-fit:cover;display:block}
.front.noimg{display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:800;color:var(--c)}
.cap{position:absolute;left:0;right:0;bottom:0;padding:18px 6px 6px;font-size:.72rem;text-align:center;
  background:linear-gradient(transparent,#000d);display:flex;flex-direction:column;gap:2px}
.badge{color:var(--c);font-weight:700}
.card.flipped.hit .front{box-shadow:0 0 22px 5px var(--c);animation:glow 1.6s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 0 34px 10px var(--c)}}
.tally{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:34px;font-size:.85rem}
.chip{border:1px solid var(--c);color:var(--c);border-radius:999px;padding:2px 12px}
#coll{margin-top:20px}
#saveStatus{text-align:center;color:var(--muted);font-size:.85rem;margin:24px 0 0}
#collList{columns:2 220px;list-style:none;padding:0;margin:10px 0 0;font-size:.85rem}
#saveStatus.warn{color:#ffb86b}
#count{text-align:center;color:var(--muted);font-size:.9rem;margin-top:30px}
.card:focus-visible,.pack:focus-visible,.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>Simulateur de booster</h1>

  <details id="setup" open>
    <summary>Fichiers et images (chargés automatiquement)</summary>
    <div class="grid">
      <label>Choisir un autre dossier d’images (facultatif)<input id="fi" type="file" webkitdirectory multiple></label>
      <label>Dossier des images<input id="dirMain" type="text" value="30th/img/"></label>
    </div>
    <p id="status">Chargement en cours…</p>
    <ul id="slotsInfo"></ul>
  </details>

  <div class="stage">
    <button id="pack" class="pack" type="button" disabled>
      <span class="big">30</span><span>Booster</span>
    </button>
    <div class="actions">
      <button id="revealAll" class="btn" type="button" hidden>Tout retourner</button>
    </div>
    <div id="cards" aria-live="polite"></div>
  </div>

  <p id="count"></p>
  <div id="tally" class="tally"></div>

  <p id="saveStatus"></p>
  <div class="actions"><button id="access" class="btn" type="button" hidden></button></div>

  <details id="coll">
    <summary id="collSum">Ma collection</summary>
    <ul id="collList"></ul>
  </details>
</main>

const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x !== undefined) e.textContent = x; return e; };
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();

const DEFAULT_PROBAS = `Rare Pikachu 100%
Commune 100%
Commune 100%
Commune 90% - Collection Classique 10%
Rare 50% - Double Rare 25% - Illustration Rare 16.7% - Illustration Spéciale Rare 5% - Commune 2.4% · Rare Futuriste 0.97%`;

let cards = [], slots = [], byRarity = {}, imgMap = {}, busy = false;

/* ---------- Lecture des fichiers ---------- */
function parseListe(t) {
  return t.replace(/^\uFEFF/, '').split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    let p = l.split('\t');
    if (p.length < 3) p = l.split(/\s{2,}/);
    if (p.length < 3) return null;
    return { id: p[0].trim(), name: p[1].trim(), rarity: p.slice(2).join(' ').trim() };
  }).filter(Boolean);
}

// Une ligne = une carte du booster : « Commune 90% - Collection Classique 10% »
function parseProbas(t) {
  return t.replace(/^\uFEFF/, '').split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    l = l.replace(/^\d+\s*[).:-]\s+/, '');
    return l.split(/\s+[-–—·•|;]\s+/).map(part => {
      const m = part.trim().match(/^(.+?)\s+(\d+(?:[.,]\d+)?)\s*%$/);
      return m ? { rarity: m[1].trim(), p: parseFloat(m[2].replace(',', '.')) } : null;
    }).filter(Boolean);
  }).filter(s => s.length);
}

function ready() {
  if (!cards.length || !slots.length) return;
  byRarity = {};
  cards.forEach(c => (byRarity[norm(c.rarity)] ||= []).push(c));
  const missing = [...new Set(slots.flat().map(o => o.rarity))].filter(r => !byRarity[norm(r)]);
  const st = $('#status');
  st.textContent = `${cards.length} cartes, ${slots.length} cartes par booster.` +
    (missing.length ? ` Raretés sans carte dans liste.txt : ${missing.join(', ')}.` : '');
  st.className = missing.length ? 'warn' : '';
  const ul = $('#slotsInfo'); ul.replaceChildren();
  slots.forEach((s, i) => ul.append(el('li', '', `Carte ${i + 1} : ` + s.map(o => `${o.rarity} ${o.p} %`).join(', '))));
  $('#pack').disabled = !playerLoaded;
}

$('#fi').onchange = e => {
  imgMap = {};
  for (const f of e.target.files) {
    const path = f.webkitRelativePath || f.name;
    if (!/\.(webp|png|jpe?g|gif|avif)$/i.test(f.name) || /nuit.?noire/i.test(path)) continue; // évite les doublons 001…
    const key = f.name.replace(/\.[^.]+$/, '').toLowerCase();
    if (!imgMap[key]) imgMap[key] = URL.createObjectURL(f);
  }
};

// Au démarrage : données intégrées, remplacées par 30th/liste.txt et 30th/probas.txt une fois le dossier du jeu autorisé
window.addEventListener('load', async () => {
  cards = parseListe(DEFAULT_LISTE); slots = parseProbas(DEFAULT_PROBAS);
  ready(); refreshStats();
  $('#setup').open = false;
  await init();
});

/* ---------- Tirage ---------- */
function pickOption(slot) {
  const opts = slot.filter(o => byRarity[norm(o.rarity)]);
  const total = opts.reduce((s, o) => s + o.p, 0);
  let r = Math.random() * total;
  for (const o of opts) { if ((r -= o.p) < 0) return { o, share: o.p / total }; }
  return { o: opts[opts.length - 1], share: 1 };
}

function draw() {
  const pack = [];
  for (const slot of slots) {
    const { o, share } = pickOption(slot);
    const pool = byRarity[norm(o.rarity)];
    let c, n = 0;
    do { c = pool[Math.floor(Math.random() * pool.length)]; n++; } while (pack.some(x => x.card.id === c.id) && n < 25);
    pack.push({ card: c, hit: share < 0.1 });
  }
  return pack;
}

/* ---------- Affichage ---------- */
const COL = { 'commune': '#aab0c8', 'rare': '#4da3ff', 'double rare': '#ffcb3d', 'illustration rare': '#3ddc97',
  'illustration speciale rare': '#ff6fb5', 'rare futuriste': '#b88cff', 'rare pikachu': '#ffe04d', 'collection classique': '#ff9a5c' };
function col(r) {
  const k = norm(r);
  if (COL[k]) return COL[k];
  let h = 0; for (const ch of k) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return `hsl(${h} 70% 65%)`;
}
function imgSrc(id) {
  if (imgMap[id.toLowerCase()]) return imgMap[id.toLowerCase()];
  return $('#dirMain').value.trim().replace(/\/?$/, '/') + id + '.webp';
}

function render(pack) {
  const box = $('#cards'); box.replaceChildren();
  pack.forEach(({ card, hit }, i) => {
    const b = el('button', 'card' + (hit ? ' hit' : '')); b.type = 'button';
    b.style.setProperty('--c', col(card.rarity)); b.style.animationDelay = i * 90 + 'ms';
    const inner = el('div', 'inner'), back = el('div', 'face back'), front = el('div', 'face front');
    const img = new Image(); img.alt = card.name; img.src = imgSrc(card.id);
    img.onerror = () => { img.remove(); front.classList.add('noimg'); front.textContent = card.id; front.append(capOf(card)); };
    front.append(img, capOf(card));
    inner.append(back, front); b.append(inner);
    b.onclick = () => b.classList.toggle('flipped');
    box.append(b);
  });
  player.boosters++;
  pack.forEach(({ card }) => { player.cards[card.id] = (player.cards[card.id] || 0) + 1; });
  refreshStats();
  save();
  $('#revealAll').hidden = false;
}
function capOf(card) {
  const cap = el('div', 'cap');
  cap.append(el('span', '', card.id + ' · ' + card.name), el('span', 'badge', card.rarity));
  return cap;
}

$('#pack').onclick = () => {
  if (busy) return; busy = true;
  const pack = draw(), p = $('#pack');
  $('#setup').open = false;
  p.classList.add('open');
  setTimeout(() => { p.classList.remove('open'); render(pack); busy = false; }, 650);
};
$('#revealAll').onclick = () => {
  document.querySelectorAll('.card:not(.flipped)').forEach((c, i) => setTimeout(() => c.classList.add('flipped'), i * 250));
};

/* ---------- Sauvegarde : player.txt, à côté du dossier 30th ---------- */
// player.txt est à côté du dossier 30th. Format : « extension_boosters<TAB>nombre », puis « extension_id<TAB>quantité » par carte obtenue.
// Les lignes d'une autre extension (préfixe différent) sont conservées telles quelles à la réécriture.
const SET = '30th', PLAYER_FILE = 'player.txt', hasFS = 'showDirectoryPicker' in window;
let player = { boosters: 0, cards: {}, other: [] }, canSave = false, playerLoaded = false, dir = null, pending = null;

function serialize() {
  const rows = Object.entries(player.cards).filter(([, n]) => n > 0).sort(([a], [b]) => a.localeCompare(b))
    .map(([id, n]) => `${SET}_${id}\t${n}`);
  return [`${SET}_boosters\t${player.boosters}`, ...rows, ...player.other].join('\n') + '\n';
}
function deserialize(t) {
  const p = { boosters: 0, cards: {}, other: [] };
  for (const l of t.replace(/^\uFEFF/, '').split(/\r?\n/)) {
    const f = l.split('\t').map(s => s.trim());
    const n = parseInt(f[f.length - 1], 10);
    if (!f[0] || !(n >= 0)) continue;
    const m = f[0].match(/^([^_\s]+)_(.+)$/);
    if (m && m[1] !== SET) { p.other.push(l.trim()); continue; }
    const key = (m ? m[2] : f[0]).replace(/\.[A-Za-z0-9]+$/, ''); // accepte aussi les anciens formats
    if (key.toLowerCase() === 'boosters') p.boosters = n; else if (f.length >= 2) p.cards[key] = n;
  }
  return p;
}
function setSave(msg, warn) { const s = $('#saveStatus'); s.textContent = msg; s.className = warn ? 'warn' : ''; }

// Seule une référence au dossier autorisé est gardée par le navigateur (pas la progression) : elle évite de le re-choisir.
const idb = () => new Promise((res, rej) => {
  const r = indexedDB.open('booster30th', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('h');
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
async function idbGet(k) {
  const db = await idb();
  return new Promise((res, rej) => { const q = db.transaction('h').objectStore('h').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
}
async function idbSet(k, v) {
  const db = await idb();
  return new Promise((res, rej) => { const t = db.transaction('h', 'readwrite'); t.objectStore('h').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); });
}
const readText = async (parent, name) => (await (await parent.getFileHandle(name)).getFile()).text();
function showAccess(label) { const b = $('#access'); b.textContent = label; b.hidden = false; }

async function useDir(d) {
  let sub;
  try { sub = await d.getDirectoryHandle(SET); } catch (e) {
    pending = null; showAccess('Choisir le dossier du jeu');
    setSave('Le dossier « ' + SET + ' » est introuvable ici : choisissez le dossier qui contient booster.html et ' + SET + '.', true);
    return;
  }
  try { const c = parseListe(await readText(sub, 'liste.txt')); if (c.length) cards = c; } catch (e) { /* données intégrées */ }
  try { const s = parseProbas(await readText(sub, 'probas.txt')); if (s.length) slots = s; } catch (e) { /* données intégrées */ }
  try {
    player = deserialize(await readText(d, PLAYER_FILE));
    setSave('Progression chargée depuis ' + PLAYER_FILE + '.');
  } catch (e) {
    if (e.name !== 'NotFoundError') { setSave('Lecture de ' + PLAYER_FILE + ' impossible : ' + e.message, true); return; }
    player = { boosters: 0, cards: {}, other: [] };
    setSave(PLAYER_FILE + ' sera créé au premier booster.');
  }
  dir = d; canSave = playerLoaded = true;
  $('#access').hidden = true;
  ready(); refreshStats();
}

async function init() {
  if (!hasFS) {
    playerLoaded = true; ready();
    setSave('Ce navigateur ne peut pas écrire dans un fichier : utilisez Chrome ou Edge. La progression n’est pas sauvegardée.', true);
    return;
  }
  let h = null;
  try { h = await idbGet('dir'); } catch (e) { /* ignoré */ }
  try { if (h && (await h.queryPermission({ mode: 'readwrite' })) === 'granted') return useDir(h); } catch (e) { h = null; }
  pending = h;
  showAccess(h ? 'Reprendre la sauvegarde' : 'Choisir le dossier du jeu');
  setSave(h ? 'Autorisez l’accès au dossier du jeu pour reprendre votre progression dans ' + PLAYER_FILE + '.'
            : 'Choisissez le dossier qui contient booster.html et ' + SET + ' : la progression sera enregistrée dans ' + PLAYER_FILE + ', à côté de ' + SET + '.');
}

$('#access').onclick = async () => {
  try {
    let h = pending;
    if (h) { if ((await h.requestPermission({ mode: 'readwrite' })) !== 'granted') throw new Error('autorisation refusée'); }
    else h = await showDirectoryPicker({ mode: 'readwrite' });
    try { await idbSet('dir', h); } catch (e) { /* ignoré */ }
    await useDir(h);
  } catch (e) { if (e.name !== 'AbortError') setSave('Accès au dossier impossible : ' + e.message, true); }
};

async function save() {
  if (!canSave) return;
  try {
    const w = await (await dir.getFileHandle(PLAYER_FILE, { create: true })).createWritable();
    await w.write(serialize()); await w.close();
    setSave('Enregistré dans ' + PLAYER_FILE + '.');
  } catch (e) { setSave('Écriture impossible dans ' + PLAYER_FILE + ' : ' + e.message, true); }
}

function refreshStats() {
  const n = player.boosters;
  $('#count').textContent = n + (n > 1 ? ' boosters ouverts' : ' booster ouvert');
  const byId = Object.fromEntries(cards.map(c => [c.id, c]));
  const owned = Object.keys(player.cards).filter(id => player.cards[id] > 0).sort((a, b) => a.localeCompare(b));
  const rar = {};
  owned.forEach(id => { const c = byId[id]; if (c) rar[c.rarity] = (rar[c.rarity] || 0) + player.cards[id]; });
  const t = $('#tally'); t.replaceChildren();
  Object.entries(rar).sort((a, b) => b[1] - a[1]).forEach(([r, k]) => {
    const c = el('span', 'chip', `${r} : ${k}`); c.style.setProperty('--c', col(r)); t.append(c);
  });
  $('#collSum').textContent = 'Ma collection : ' + owned.length + (cards.length ? ' sur ' + cards.length : '') + ' cartes différentes';
  const ul = $('#collList'); ul.replaceChildren();
  owned.forEach(id => ul.append(el('li', '', `${id} · ${byId[id] ? byId[id].name : ''} × ${player.cards[id]}`)));
}

refreshStats();
</script>
</body>
